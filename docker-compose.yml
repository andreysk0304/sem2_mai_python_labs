services:
  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 5s

  demo:
    build: .
    environment:
      API_URL: http://api:8000
    command: python run_demo.py
    depends_on:
      api:
        condition: service_healthy